<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Build Your Habit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Build Your Habit</h1>

    <p>
        Build better habits gradually with a personalized plan that adapts to your progress.
    </p>

    <div class="card">

        <label for="habit-name">Habit name:</label>

        <input
            type="text"
            id="habit-name"
            name="habit-name"
            placeholder="e.g Running"
        >

        <label for="target-duration">
            Target duration in minutes:
        </label>

        <input
            type="number"
            id="target-duration"
            placeholder="e.g 40"
            min="1"
        >

        <button
            type="button"
            class="create-habit">
            Create Habit
        </button>

    </div>

    <div id="result"></div>

    <script src="./script.js"></script>

</body>

</html>
